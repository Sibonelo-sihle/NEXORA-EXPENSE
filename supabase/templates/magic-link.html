<!doctype html>
<html>
  <body
    style="
      margin: 0;
      background: #f8fafc;
      font-family: Arial, sans-serif;
      color: #0f172a;
    "
  >
    <div
      style="
        max-width: 520px;
        margin: 40px auto;
        padding: 32px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
      "
    >
      <img
        src="{{ .SiteURL }}/favicon.png"
        width="48"
        height="50"
        alt="Official NEXORA logo"
      />
      <h2>NEXORA Expense</h2>
      <h1 style="font-size: 24px">Sign in to NEXORA Expense</h1>
      <p style="color: #64748b; line-height: 1.6">
        Use this secure link to sign in to your workspace.
      </p>
      <p style="margin: 32px 0">
        <a
          href="{{ .ConfirmationURL }}"
          style="
            background: #7c3aed;
            color: white;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 8px;
          "
          >Sign in</a
        >
      </p>
      <p style="font-size: 13px; color: #64748b">
        If you did not request this email, you can ignore it.
      </p>
      <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 28px 0" />
      <p style="font-size: 12px; color: #64748b">
        Powered by NEXORA LABS<br />Software for a Better Tomorrow.
      </p>
    </div>
  </body>
</html>
